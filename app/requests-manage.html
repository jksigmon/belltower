<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Manager — Belltower</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="manifest" href="/icons/site.webmanifest">
  <link rel="icon" href="/icons/favicon.ico">
  <link rel="stylesheet" href="/admin-ui.css" />
  <style>
    .reqm-main { max-width: 1300px; margin: 0 auto; padding: 24px 16px 48px; }
    .reqm-main .data-table { table-layout: fixed; width: 100%; }
    .reqm-title { font-size: 22px; font-weight: 700; color: #111827; margin: 0 0 4px; }
    .reqm-sub   { font-size: 14px; color: #6b7280; margin: 0 0 24px; }

    .reqm-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .reqm-filters select { width: auto; min-width: 160px; }

    .req-status-badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge-amber { background: #fef3c7; color: #92400e; }
    .badge-blue  { background: #dbeafe; color: #1e40af; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-red   { background: #fee2e2; color: #991b1b; }
    .badge-purple{ background: #ede9fe; color: #5b21b6; }

    .req-responses { display: flex; flex-direction: column; gap: 10px; }
    .req-response-row { display: flex; flex-direction: column; gap: 2px; }
    .req-response-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #9ca3af; }
    .req-response-value { font-size: 14px; color: #111827; }

    .reqm-meta { font-size: 13px; color: #6b7280; }
    .reqm-save-error { color: #dc2626; font-size: 13px; margin: 0 auto 0 0; }
  </style>
</head>
<body class="admin-page">

  <header>
    <div class="header-left">
      <a id="backBtn" href="/staff.html" class="btn btn-admin">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>
      <img src="/images/belltower-logo.png" alt="Belltower" class="admin-logo" />
    </div>
    <div class="header-actions">
      <div class="user-menu" id="userMenu">
        <button class="user-avatar" id="userAvatar" aria-label="Account menu" aria-expanded="false">
          <span id="userInitials"></span>
        </button>
        <div class="user-dropdown" id="userDropdown" hidden>
          <div class="user-dropdown-header">
            <div class="user-dropdown-name" id="userDropdownName"></div>
          </div>
          <a href="/help.html" class="user-dropdown-item">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Help
          </a>
          <div class="user-dropdown-divider"></div>
          <button class="user-dropdown-item signout" id="signOut">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="placement-main reqm-main">
    <h1 class="reqm-title">Request Manager</h1>
    <p class="reqm-sub">Review and update requests submitted to the forms you manage.</p>

    <div id="reqmFilters" class="reqm-filters" style="display:none;">
      <select id="reqmFilterCat" class="admin-input">
        <option value="">All My Forms</option>
      </select>
      <select id="reqmFilterStatus" class="admin-input">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="in_review">In Review</option>
        <option value="resolved">Resolved</option>
        <option value="completed">Completed</option>
        <option value="denied">Denied</option>
      </select>
    </div>

    <div id="reqmListWrap"></div>

    <!-- Detail drawer -->
    <div id="reqmDrawer" class="drawer" role="dialog" aria-modal="true" aria-label="Request Detail">
      <div class="drawer-header">
        <h3 id="reqmDrawerTitle">Request Detail</h3>
        <button class="drawer-close" id="reqmDrawerClose" aria-label="Close">&times;</button>
      </div>
      <div class="drawer-body" id="reqmDrawerBody"></div>
      <div class="drawer-footer">
        <p id="reqmSaveError" class="reqm-save-error" style="display:none;"></p>
        <button class="btn" id="reqmCloseBtn">Close</button>
        <button class="btn btn-primary" id="reqmSaveBtn">Save</button>
      </div>
    </div>
    <div id="reqmOverlay" class="drawer-overlay"></div>
  </div>

  <script type="module" src="/app/requests-manage.js"></script>
</body>
</html>
