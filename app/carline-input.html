<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Carline Input" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Carline Input — Belltower</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="manifest" href="/icons/site.webmanifest">
  <link rel="icon" href="/icons/favicon.ico">

<body>

<div id="clLoading" class="cl-loading">
  <div class="cl-spinner"></div>
  <span>Loading…</span>
</div>

<div id="inputApp" hidden>

  <header id="inputHeader">
    <div class="inp-header-top">
      <span class="cl-school-name" id="inpSchoolName">Carline</span>
    </div>
    <div class="inp-header-bottom">
      <div class="inp-header-left">
        <span class="cl-status-badge open" id="inpStatusBadge">OPEN</span>
        <span class="cl-campus-label" id="inpCampusLabel" hidden></span>
      </div>
      <div class="inp-header-right">
        <button class="cl-icon-btn" id="btnDarkMode" title="Toggle dark mode"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <button class="cl-dismiss-btn close" id="btnCloseDismissal" hidden><span>✕</span><span>Close</span></button>
        <button class="cl-signout-btn" id="btnSignOut">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span class="cl-btn-label">Sign out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- No active event -->
  <div id="inpNoEvent" class="cl-no-event" hidden>
    <h2 id="inpNoEventTitle">No Active Dismissal</h2>
    <p id="inpNoEventMsg">Dismissal hasn't started yet. Ask an administrator to start today's dismissal.</p>
    <button class="cl-start-btn" id="btnStartNoEvent" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg> Start Dismissal</button>
    <button class="cl-start-btn reopen" id="btnReopenDismissal" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg> Reopen Dismissal</button>
  </div>

  <!-- Main input content -->
  <div id="inputMain" hidden>

    <!-- Tag entry + keypad -->
    <div class="inp-tag-section">

      <div class="inp-tag-card">
        <div class="inp-tag-topline">
          <span>Enter Carline Number</span>
          <span class="inp-tag-dot" id="tagDot"></span>
        </div>
        <div class="inp-tag-row">
          <div class="inp-tag-display" id="tagDisplay">
            <span id="tagDisplayText">—</span><span class="inp-tag-cursor" id="tagCursor"></span>
          </div>
          <button class="inp-tag-clear-btn" id="btnClearTag" title="Clear">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Clear
          </button>
        </div>
      </div>

      <div class="inp-keypad" id="keypad">
        <!-- built by JS -->
      </div>

      <div class="inp-call-row">
        <button class="inp-call-btn call" id="btnCall">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Call
        </button>
        <button class="inp-call-btn recall" id="btnRecall">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Recall
        </button>
      </div>

      <div class="inp-undo-row">
        <button class="inp-undo-btn" id="btnUndoLast" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          Undo Last
        </button>
        <button class="inp-undo-btn" id="btnUndoTag">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          Undo Tag #
        </button>
      </div>

      <div class="inp-allcall-row" id="allCallRow" hidden>
        <button class="inp-allcall-btn" id="btnAllCall">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          All Call
        </button>
      </div>

    </div>

    <!-- Flag-based family groups (e.g. Skip Car Line) -->
    <div class="inp-section" id="flagGroupSection" hidden>
      <div class="inp-section-title">
        <span>Special Dismissal</span>
      </div>
      <div class="inp-bus-grid" id="flagGroupGrid"></div>
    </div>

    <!-- Bus groups -->
    <div class="inp-section" id="busSection">
      <div class="inp-section-title">
        <span>Bus Groups</span>
      </div>
      <div class="inp-bus-grid" id="busGrid"></div>
    </div>

    <!-- Admin actions -->
    <div class="inp-section" id="adminSection" hidden>
      <div class="inp-section-title">Admin</div>
      <div class="inp-danger-row">
        <button class="inp-danger-btn" id="btnResetDay"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> Reset Day</button>
      </div>
    </div>

    <!-- Recent activity -->
    <div class="inp-section">
      <div class="inp-section-title">
        <span>Recent Activity</span>
      </div>
      <ul class="inp-recent-list" id="recentList"></ul>
    </div>

  </div><!-- /inputMain -->

</div><!-- /inputApp -->

<!-- Campus picker -->
<div id="campusPicker" hidden>
  <div id="campusPickerDialog">
    <h3>Select Campus</h3>
    <p>Which campus is this dismissal for?</p>
    <div id="campusPickerList"></div>
    <button id="campusPickerCancel">Cancel</button>
  </div>
</div>

<style>
  /* Rapid double-taps while entering a carline tag (e.g. "33" then "3")
     otherwise trigger iOS Safari's double-tap-to-zoom. touch-action keeps
     pinch-zoom available for accessibility while dropping just the
     double-tap gesture. */
  html, body { touch-action: manipulation; }

  #campusPicker {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #campusPicker[hidden] { display: none !important; }
  #campusPickerDialog {
    background: var(--cl-surface);
    border-radius: 14px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #campusPickerDialog h3 {
    font-size: 18px;
    font-weight: 700;
    color: var(--cl-text);
    margin-bottom: 6px;
  }
  #campusPickerDialog p {
    font-size: 13px;
    color: var(--cl-text-muted);
    margin-bottom: 20px;
  }
  #campusPickerList {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .cl-campus-pick-btn {
    padding: 14px 18px;
    background: #059669;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    transition: background 120ms;
  }
  .cl-campus-pick-btn:hover { background: #047857; }
  #campusPickerCancel {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--cl-border);
    border-radius: 8px;
    color: var(--cl-text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: background 120ms;
  }
  #campusPickerCancel:hover { background: var(--cl-bg); }
</style>

<div class="cl-toast" id="clToast"></div>

<script type="module">
import { supabase } from '/app/admin.supabase.js?v=2';
import { playTones, wireAudioPriming } from '/app/carline-audio.js';

// ─── SVG constants ────────────────────────────────────────────────────
const SVG_MOON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
const SVG_SUN  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const SVG_BUS  = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/><line x1="9" y1="19" x2="15" y2="19"/></svg>`;
const SVG_FAMILIES = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;

// Family-flag groups: batch-call every family carrying a special-handling
// flag in one tap, instead of keying each tag. Membership is derived from
// the boolean on families -- there is no group membership table to keep in
// sync. `callType` is stamped on each carline_calls row so the button's
// state survives a page reload, is shared across operator devices, and an
// undo can target only the students this group called.
const FLAG_GROUPS = [
  { flag: 'skip_car_line', label: 'Skip Car Line', callType: 'SKIP_LINE', icon: SVG_FAMILIES },
];

// ─── State ────────────────────────────────────────────────────────────
let profile      = null;
let currentEvent = null;
let allStudents  = [];
let allBusGroups = [];
let allPickupGroups = [];       // carline_pickup_groups for this school
let calledBusIds = new Set();   // bus_group_ids called this event
let allCampuses  = [];
let activeCampusId = null;    // null = no campus filter (school-wide)
let familyTagMap  = new Map(); // family_id → tag_number  (individual family tags)
let tagFamilyMap  = new Map(); // tag_number → family_id  (individual family lookup)
let carpoolTagMap = new Map(); // tag_number → [family_id, ...]  (pickup tag → member families)
let carpoolStudentMap = new Map(); // tag_number → [student_id, ...]  (pickup tag → individual students)
let flagFamilyIds = new Map(); // FLAG_GROUPS flag → Set(family_id)
let callStatus   = new Map(); // student_id → status
let callTypeById = new Map(); // student_id → call_type of its current call row
let undoStack    = [];        // [{ studentIds, prevStatus }]
let recentCalls  = [];        // [{ tag, names, type, time, ts, isRecall }]
let realtimeChannel = null;
let eventPollTimer  = null;
let callsPollTimer  = null;
let tagBuffer    = '';
let toastTimer   = null;

// ─── Boot ─────────────────────────────────────────────────────────────
async function boot() {
  const sessionRes = await supabase.auth.getSession();
  const session = sessionRes?.data?.session;
  if (!session) { window.location.href = '/login.html'; return; }

  const { data: p, error } = await supabase
    .from('profiles')
    .select('*, schools!profiles_school_id_fkey(name)')
    .eq('user_id', session.user.id)
    .single();

  if (error || !p) { alert('Profile load failed: ' + (error?.message ?? 'not found')); return; }
  if (!p.can_view_carline && !p.is_superadmin) {
    window.location.href = '/staff.html';
    return;
  }
  profile = p;

  document.getElementById('inpSchoolName').textContent = p.schools?.name ?? 'Carline';
  if (p.is_superadmin || p.can_manage_carline) {
    document.getElementById('adminSection').hidden = false;
  }

  await Promise.all([ loadStudents(), loadBusGroups(), loadFamilyTags(), loadCarpoolTags(), loadCampuses(), loadPickupGroups() ]);

  // Default campus from employee assignment
  if (p.employee_id && allCampuses.length > 0) {
    const { data: emp } = await supabase
      .from('employees')
      .select('campus_id')
      .eq('id', p.employee_id)
      .single();
    activeCampusId = emp?.campus_id ?? null;
  }
  await ensureCarlineEvent();
  if (currentEvent) {
    await loadExistingCalls();
    await loadBusArrivals();
    if (currentEvent.status !== 'CLOSED') { setupRealtime(); startCallsPoller(); }
  }

  buildKeypad();
  renderBusGrid();
  renderFlagGroupGrid();
  wireEvents();
  watchForNewEvents();

  document.getElementById('clLoading').hidden = true;
  document.getElementById('inputApp').hidden  = false;
}

// The dismissal "day" must follow the school's clock, not UTC. Eastern time is
// UTC-4/-5, so toISOString().slice(0,10) rolls the date over at 8pm local and
// every carline page starts looking for tomorrow's event. Mirrors
// toLocalISODate() in admin.shared.js, which these standalone pages don't import.
function localToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// ─── Data loaders ─────────────────────────────────────────────────────
// PostgREST caps an unranged select at 1000 rows, so anything past the cap is
// dropped with no error — on a roster ordered by last_name that silently made
// every student from the end of the alphabet uncallable at dismissal. Page
// through instead. Same reasoning as fetchAllIds in admin.families.js.
const ROW_PAGE_SIZE = 1000;

async function fetchAllRows(build) {
  const rows = [];
  let from = 0;
  for (;;) {
    const { data, error } = await build().range(from, from + ROW_PAGE_SIZE - 1);
    if (error) { console.error('Paged fetch failed', error); return rows; }
    rows.push(...(data ?? []));
    if ((data?.length ?? 0) < ROW_PAGE_SIZE) return rows;
    from += ROW_PAGE_SIZE;
  }
}

// Same as fetchAllRows, but returns null (rather than whatever partial rows
// were collected) on error. Callers that destructively clear()-and-rebuild
// state from the result need to tell "genuinely empty" apart from "the
// request failed" -- silently treating a failure as zero rows is what wiped
// the board on 8/19. Mirrors fetchAllRowsOrNull in carline.html.
async function fetchAllRowsOrNull(build) {
  const rows = [];
  let from = 0;
  for (;;) {
    const { data, error } = await build().range(from, from + ROW_PAGE_SIZE - 1);
    if (error) { console.error('Paged fetch failed', error); return null; }
    rows.push(...(data ?? []));
    if ((data?.length ?? 0) < ROW_PAGE_SIZE) return rows;
    from += ROW_PAGE_SIZE;
  }
}

async function loadStudents() {
  allStudents = await fetchAllRows(() => supabase
    .from('students')
    .select('id, first_name, last_name, family_id, bus_group_id, campus_id, grade_level')
    .eq('school_id', profile.school_id)
    .eq('active', true)
    .order('last_name'));
}

async function loadPickupGroups() {
  const { data } = await supabase
    .from('carline_pickup_groups')
    .select('id, name, campus_id, grade_levels, active')
    .eq('school_id', profile.school_id)
    .eq('active', true);
  allPickupGroups = data || [];
}

async function loadCampuses() {
  const { data } = await supabase
    .from('campuses')
    .select('id, name')
    .eq('school_id', profile.school_id)
    .order('name');
  allCampuses = data || [];
}

async function loadBusGroups() {
  const { data } = await supabase
    .from('bus_groups')
    .select('id, name, route_number')
    .eq('school_id', profile.school_id)
    .order('name');
  allBusGroups = data || [];
}

async function loadFamilyTags() {
  const flagCols = FLAG_GROUPS.map(g => g.flag).join(', ');
  // Paged for the same reason as loadStudents — a family past the 1000-row cap
  // would drop out of tagFamilyMap and its number would read as "not found".
  const data = await fetchAllRows(() => supabase
    .from('families')
    .select(`id, carline_tag_number, ${flagCols}`)
    .eq('school_id', profile.school_id)
    .eq('active', true)
    .order('id'));
  familyTagMap.clear();
  tagFamilyMap.clear();
  flagFamilyIds.clear();
  FLAG_GROUPS.forEach(g => flagFamilyIds.set(g.flag, new Set()));
  (data || []).forEach(f => {
    if (f.carline_tag_number) {
      const tag = String(f.carline_tag_number);
      familyTagMap.set(f.id, tag);
      tagFamilyMap.set(tag, f.id);
    }
    FLAG_GROUPS.forEach(g => { if (f[g.flag]) flagFamilyIds.get(g.flag).add(f.id); });
  });
}

async function loadCarpoolTags() {
  const data = await fetchAllRows(() => supabase
    .from('carpools')
    .select('tag_number, carline_tags ( family_id ), carpool_students ( student_id )')
    .eq('school_id', profile.school_id)
    .eq('active', true)
    .order('id'));
  carpoolTagMap.clear();
  carpoolStudentMap.clear();
  data.forEach(cp => {
    const tag        = String(cp.tag_number);
    const familyIds  = (cp.carline_tags     || []).map(ct => ct.family_id).filter(Boolean);
    const studentIds = (cp.carpool_students || []).map(cs => cs.student_id).filter(Boolean);
    if (familyIds.length)  carpoolTagMap.set(tag, familyIds);
    if (studentIds.length) carpoolStudentMap.set(tag, studentIds);
  });
}

// Single resolution path for every place a tag is typed. A pickup tag can carry
// whole families, individual students, or both; a plain family number resolves
// to that one household. Pickup tags win over family numbers (unchanged), which
// is why the two can never share a number — see findTagConflict / the DB guards.
// Returns null when the tag is unknown.
function resolveTag(tag) {
  const familyIds  = carpoolTagMap.get(tag);
  const studentIds = carpoolStudentMap.get(tag);
  if (familyIds || studentIds) {
    return { familyIds: familyIds ?? [], studentIds: studentIds ?? [] };
  }
  const fid = tagFamilyMap.get(tag);
  if (!fid) return null;
  return { familyIds: [fid], studentIds: [] };
}

// Resolves a tag all the way to the students it should call, scoped to the
// active campus. Returns null for an unknown tag (distinct from a known tag
// with nobody at this campus, which returns an empty array).
function studentsForTag(tag) {
  const resolved = resolveTag(tag);
  if (!resolved) return null;
  const directIds = new Set(resolved.studentIds);
  return allStudents.filter(s =>
    (resolved.familyIds.includes(s.family_id) || directIds.has(s.id)) && atActiveCampus(s)
  );
}

async function loadExistingCalls() {
  // Paginated + stably ordered, matching the display board and the kiosk edge
  // function. Without this an event past PostgREST's 1000-row cap silently
  // truncates -- and callStatus here isn't just display state, it decides
  // which students recallStudents()/undoFlagGroup() actually act on and what
  // every bus/flag group button counts. A truncated map reads already-called
  // students as WAITING, and with no ORDER BY the truncation set shifts
  // between polls, so it presents as intermittent wrongness on the screen
  // that decides who gets dismissed.
  const data = await fetchAllRowsOrNull(() => supabase
    .from('carline_calls')
    .select('student_id, status, call_type')
    .eq('carline_event_id', currentEvent.id)
    .order('id'));
  // A failed fetch must never be treated as "zero calls" -- clearing
  // callStatus on a transient error wipes every group-button count on this
  // screen back to zero until the next successful poll. Keep the last known
  // state and just retry next cycle instead.
  if (data === null) { console.error('loadExistingCalls failed, keeping last known state'); return; }
  callStatus.clear();
  callTypeById.clear();
  data.forEach(c => {
    callStatus.set(c.student_id, c.status);
    callTypeById.set(c.student_id, c.call_type);
  });
  updateGroupButtons();
}

async function loadBusArrivals() {
  if (!currentEvent) return;
  const { data } = await supabase
    .from('carline_bus_arrivals')
    .select('bus_group_id, recalled_at')
    .eq('carline_event_id', currentEvent.id);
  calledBusIds.clear();
  (data || []).forEach(r => { if (!r.recalled_at) calledBusIds.add(r.bus_group_id); });
}

// A student belongs to the active campus either directly, by having no campus
// at all, or by way of a pickup group that assigns their grade to this campus.
//
// A null campus_id means "all campuses" — the same convention used on
// carline_events, staff_licenses and field_trips. Treating null as "no campus"
// instead made every unassigned student silently uncallable the moment a
// campus was active, and since a school with a single campus starts dismissal
// scoped to it (see handleStartClick) rather than school-wide, that hit any
// school that had created a campus without backfilling students — the tag
// resolved fine and the operator just got "no students at this campus".
function atActiveCampus(s) {
  return activeCampusId === null ||
    s.campus_id == null ||
    s.campus_id === activeCampusId ||
    allPickupGroups.some(g => g.campus_id === activeCampusId && g.grade_levels.includes(s.grade_level));
}

// ─── Campus picker ────────────────────────────────────────────────────
function handleStartClick() {
  if (allCampuses.length <= 1) {
    startDismissal(allCampuses[0]?.id ?? null);
    return;
  }
  const list = document.getElementById('campusPickerList');
  list.innerHTML = '';
  allCampuses.forEach(c => {
    const btn = document.createElement('button');
    btn.className   = 'cl-campus-pick-btn';
    btn.textContent = c.name;
    btn.addEventListener('click', () => {
      document.getElementById('campusPicker').hidden = true;
      startDismissal(c.id);
    });
    list.appendChild(btn);
  });
  document.getElementById('campusPicker').hidden = false;
}

// ─── Carline event ─────────────────────────────────────────────────────
// Picks the event this screen should be driving. The old version filtered on
// `campus_id is null` whenever activeCampusId was unknown, which is every
// operator who didn't personally tap Start -- and with more than one campus
// every event HAS a campus, so they found nothing, got the "Start Dismissal"
// screen in the middle of a live dismissal, and tapping Start just bounced off
// the school+date+campus unique index. Dead end with no way out.
//
// Prefer this screen's campus, then a school-wide (null campus) event, then
// whatever is open. The header shows currentEvent.name (the campus name) so an
// operator can see which campus they landed on.
function pickEventForCampus(rows) {
  const all = rows || [];
  if (!all.length) return null;
  const open = all.filter(e => e.status !== 'CLOSED');
  const pool = open.length ? open : all;
  const byNewest = [...pool].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  return (activeCampusId && byNewest.find(e => e.campus_id === activeCampusId))
      || byNewest.find(e => e.campus_id == null)
      || byNewest[0];
}

async function ensureCarlineEvent() {
  const today = localToday();
  const { data } = await supabase
    .from('carline_events')
    .select('id, status, name, campus_id, created_at')
    .eq('school_id', profile.school_id)
    .eq('event_date', today);

  currentEvent = pickEventForCampus(data);
  // Adopt the event's campus so tag lookups (atActiveCampus) scope to the same
  // campus this screen is calling for.
  if (currentEvent && !activeCampusId) activeCampusId = currentEvent.campus_id ?? null;
  updateEventUI();
}

async function startDismissal(campusId = null) {
  activeCampusId = campusId;
  const today      = localToday();
  const campusName = allCampuses.find(c => c.id === campusId)?.name ?? null;
  const { data, error } = await supabase
    .from('carline_events')
    .insert({
      school_id:             profile.school_id,
      name:                  campusName ?? 'PM Dismissal',
      event_date:            today,
      status:                'OPEN',
      campus_id:             campusId,
      created_by_profile_id: profile.id,
    })
    .select('id, status, name')
    .single();
  if (error) { showToast('Failed to start dismissal'); return; }
  currentEvent = data;
  updateEventUI();
  setupRealtime();
  startCallsPoller();
  showToast('Dismissal started');
}

async function closeDismissal() {
  if (!currentEvent) return;
  if (!confirm('Close today\'s dismissal?')) return;
  const { error } = await supabase
    .from('carline_events')
    .update({ status: 'CLOSED', closed_at: new Date().toISOString(), closed_by_profile_id: profile.id })
    .eq('id', currentEvent.id);
  if (error) { showToast('Failed to close dismissal'); return; }
  currentEvent.status = 'CLOSED';
  if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
  clearInterval(callsPollTimer); callsPollTimer = null;
  updateEventUI();
  showToast('Dismissal closed');
}

async function reopenDismissal() {
  if (!currentEvent) return;
  if (!confirm("Reopen today's dismissal?")) return;
  const { error } = await supabase
    .from('carline_events')
    .update({ status: 'OPEN', closed_at: null, closed_by_profile_id: null })
    .eq('id', currentEvent.id);
  if (error) { showToast('Failed to reopen dismissal'); return; }
  currentEvent.status = 'OPEN';
  updateEventUI();
  setupRealtime();
  startCallsPoller();
  await loadExistingCalls();
  showToast('Dismissal reopened');
}

function updateEventUI() {
  const hasEvent  = !!currentEvent;
  const isOpen    = hasEvent && currentEvent.status !== 'CLOSED';
  const isClosed  = hasEvent && currentEvent.status === 'CLOSED';
  const canManage = profile.is_superadmin || profile.can_manage_carline;

  document.getElementById('inpNoEvent').hidden = isOpen;
  document.getElementById('inputMain').hidden  = !isOpen;

  document.getElementById('inpNoEventTitle').textContent = isClosed
    ? 'Dismissal Closed'
    : 'No Active Dismissal';
  document.getElementById('inpNoEventMsg').textContent = isClosed
    ? "Today's dismissal has been closed. Tap Reopen to continue."
    : "Dismissal hasn't started yet. Ask an administrator to start today's dismissal.";

  const badge = document.getElementById('inpStatusBadge');
  badge.textContent = isOpen ? 'OPEN' : 'CLOSED';
  badge.className   = 'cl-status-badge ' + (isOpen ? 'open' : 'closed');

  document.getElementById('btnCloseDismissal').hidden    = !isOpen   || !canManage;
  document.getElementById('btnStartNoEvent').hidden      = hasEvent  || !canManage;
  document.getElementById('btnReopenDismissal').hidden   = !isClosed || !canManage;

  const campusLabel = document.getElementById('inpCampusLabel');
  if (campusLabel) {
    if (hasEvent && currentEvent.name) {
      campusLabel.textContent = currentEvent.name;
      campusLabel.hidden = false;
    } else {
      campusLabel.hidden = true;
    }
  }

  document.getElementById('btnCall').disabled   = !isOpen;
  document.getElementById('btnRecall').disabled = !isOpen;
  document.getElementById('allCallRow').hidden  = !isOpen || !canManage;
}

// ─── Watch for new events (page open before dismissal starts) ─────────
function watchForNewEvents() {
  supabase
    .channel(`carline-input-events-${profile.school_id}`)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'carline_events',
      filter: `school_id=eq.${profile.school_id}`,
    }, async payload => {
      const ev = payload.new;
      if (!ev || ev.status === 'CLOSED' || currentEvent) return;
      // Respect campus filter
      if (activeCampusId ? ev.campus_id !== activeCampusId : ev.campus_id !== null) return;
      await onEventStarted(ev);
    })
    .on('postgres_changes', {
      event: 'UPDATE',
      schema: 'public',
      table: 'carline_events',
      filter: `school_id=eq.${profile.school_id}`,
    }, payload => {
      const ev = payload.new;
      if (!ev || !currentEvent || ev.id !== currentEvent.id) return;
      currentEvent.status = ev.status;
      updateEventUI();
      if (ev.status === 'CLOSED') {
        if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
        clearInterval(callsPollTimer); callsPollTimer = null;
      }
    })
    .subscribe();

  eventPollTimer = setInterval(pollForEvent, 10_000);
}

// carline_events is not in the supabase_realtime publication, so the INSERT
// listener never fires and this poll is the only way a waiting input screen
// notices dismissal started. Same campus-filter trap as ensureCarlineEvent --
// see the note there.
async function pollForEvent() {
  if (currentEvent) { clearInterval(eventPollTimer); eventPollTimer = null; return; }
  const today = localToday();
  const { data } = await supabase
    .from('carline_events')
    .select('id, status, name, campus_id, created_at')
    .eq('school_id', profile.school_id)
    .eq('event_date', today)
    .neq('status', 'CLOSED');
  const ev = pickEventForCampus(data);
  if (ev) {
    if (!activeCampusId) activeCampusId = ev.campus_id ?? null;
    await onEventStarted(ev);
  }
}

async function onEventStarted(ev) {
  clearInterval(eventPollTimer); eventPollTimer = null;
  currentEvent = ev;
  updateEventUI();
  await loadExistingCalls();
  await loadBusArrivals();
  setupRealtime();
  startCallsPoller();
  renderBusGrid();
  renderFlagGroupGrid();
  showToast('Dismissal started');
}

// ─── Realtime ─────────────────────────────────────────────────────────
function setupRealtime() {
  if (!currentEvent) return;
  if (realtimeChannel) supabase.removeChannel(realtimeChannel);

  realtimeChannel = supabase
    .channel(`carline-input-${currentEvent.id}`)
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'carline_calls',
      filter: `carline_event_id=eq.${currentEvent.id}`,
    }, row => {
      const r = row.new;
      if (!r?.student_id) return;
      const prevStatus = callStatus.get(r.student_id);
      const prevType   = callTypeById.get(r.student_id);
      callStatus.set(r.student_id, r.status);
      callTypeById.set(r.student_id, r.call_type);
      // Recounting every group button per row is wasted work when the row is
      // just the echo of a batch this device already applied locally. Call
      // type matters as well as status: a student re-called as part of a
      // group keeps status CALLED but changes which button owns them.
      if (r.status !== prevStatus || r.call_type !== prevType) updateGroupButtons();
    })
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'carline_bus_arrivals',
      filter: `carline_event_id=eq.${currentEvent.id}`,
    }, row => {
      const r = row.new;
      if (!r?.bus_group_id) return;
      if (r.recalled_at) calledBusIds.delete(r.bus_group_id);
      else calledBusIds.add(r.bus_group_id);
      updateBusButtonStates();
    })
    .subscribe();
}

// With several operators working the line at once, each input screen only ever
// knew about its own calls: carline_calls is not in the supabase_realtime
// publication so the postgres_changes listener above never fires, and the
// broadcast channel is send-only from here. Operator B's screen therefore
// showed a family as WAITING that operator A had already called, and every
// bus/flag group count was wrong on every screen but the one that pressed it.
//
// Same 8s cadence as the dismissal board's poller. Safe to run under the
// keypad: updateGroupButtons() and updateBusButtonStates() mutate the existing
// buttons in place rather than rebuilding the grids, so a poll landing while an
// operator is mid-entry cannot steal focus or drop a typed digit.
function startCallsPoller() {
  clearInterval(callsPollTimer);
  callsPollTimer = setInterval(async () => {
    if (!currentEvent || currentEvent.status === 'CLOSED') {
      clearInterval(callsPollTimer); callsPollTimer = null;
      return;
    }
    await loadBusArrivals();
    await loadExistingCalls();   // repaints the group buttons itself
  }, 8000);
}

// ─── Call actions ──────────────────────────────────────────────────────

// carline_calls is NOT in the supabase_realtime publication, so the dismissal
// board's postgres_changes listener never fires — broadcast is the only channel
// that actually drives it. Anything that changes call state must broadcast, or
// the board silently keeps showing stale statuses until someone refreshes.
//
// One long-lived channel per event, created on demand and never torn down.
// Previously each broadcast made a fresh channel on the same topic and removed
// it 1500ms later; two calls inside that window (tapping bus buttons in quick
// succession) had the first teardown kill the topic the second was sending on,
// so the second and third updates were dropped.
let displayChannel     = null;
let displayChannelKey  = null;
let displayChannelReady = false;
const pendingBroadcasts = [];

function getDisplayChannel() {
  const key = `carline-display-${currentEvent.id}`;
  if (displayChannel && displayChannelKey === key) return displayChannel;

  if (displayChannel) supabase.removeChannel(displayChannel);
  displayChannelKey   = key;
  displayChannelReady = false;
  displayChannel      = supabase.channel(key);
  displayChannel.subscribe(st => {
    if (st !== 'SUBSCRIBED') return;
    displayChannelReady = true;
    while (pendingBroadcasts.length) {
      const msg = pendingBroadcasts.shift();
      displayChannel.send(msg);
    }
  });
  return displayChannel;
}

// Queues until the channel is live so the very first call of the day — sent
// while the socket is still connecting — isn't dropped.
function broadcastToDisplay(event, payload) {
  if (!currentEvent) return;
  const ch  = getDisplayChannel();
  const msg = { type: 'broadcast', event, payload };
  if (displayChannelReady) ch.send(msg);
  else pendingBroadcasts.push(msg);
}

function broadcastStudentCalls(calls) {
  broadcastToDisplay('student_call', { calls });
}

async function callByTag(tag, isRecall = false) {
  if (!tag) return;
  if (!currentEvent || currentEvent.status === 'CLOSED') {
    showToast('Dismissal is not open'); return;
  }

  const students = studentsForTag(tag);
  if (students === null) { showToast(`Tag ${tag} not found`); return; }
  if (!students.length) { showToast(`Tag ${tag}: no students at this campus`); return; }

  if (isRecall) {
    await recallStudents(students, tag);
  } else {
    await callStudents(students, tag, 'FAMILY');
  }

  clearTag();
}

async function callStudents(students, tag, callType) {
  const prevStatuses = students.map(s => ({ id: s.id, prev: callStatus.get(s.id) ?? 'WAITING' }));
  const now = new Date().toISOString();

  const rows = students.map(s => ({
    school_id: profile.school_id,
    carline_event_id: currentEvent.id,
    student_id: s.id,
    family_id: s.family_id,
    call_type: callType,
    status: 'CALLED',
    called_at: now,
    called_by_profile_id: profile.id,
  }));

  const { error } = await supabase
    .from('carline_calls')
    .upsert(rows, { onConflict: 'carline_event_id,student_id' });

  if (error) { showToast('Call failed'); return; }

  students.forEach(s => { callStatus.set(s.id, 'CALLED'); callTypeById.set(s.id, callType); });
  undoStack.push({ studentIds: students.map(s => s.id), prevStatuses, tag, callType });
  document.getElementById('btnUndoLast').disabled = false;

  const names = students.map(s => `${s.first_name} ${s.last_name}`);
  pushRecent(tag, names, callType, false);
  playCallSound();
  const label = callType === 'FAMILY' ? `Tag ${tag}` : tag;
  showToast(`${label} — ${students.length} student${students.length !== 1 ? 's' : ''} called`);
  updateGroupButtons();
  broadcastStudentCalls(students.map(s => ({ student_id: s.id, status: 'CALLED', called_at: now, call_type: callType })));
}

async function recallStudents(students, tag) {
  const prevStatuses = students.map(s => ({ id: s.id, prev: callStatus.get(s.id) ?? 'WAITING' }));
  const now = new Date().toISOString();

  // Targets the exact students this tag resolved to, not their family_id. A tag
  // carrying individual students has no family to filter on, so the old
  // family_id filter matched zero rows and the recall failed silently — the
  // update succeeds either way, so nothing surfaced the miss.
  const { error } = await supabase
    .from('carline_calls')
    .update({ status: 'RECALLED', recalled_at: now })
    .eq('carline_event_id', currentEvent.id)
    .in('student_id', students.map(s => s.id))
    .in('status', ['CALLED', 'WAITING']);

  if (error) { showToast('Recall failed'); return; }

  const recalled = students.filter(s => ['CALLED', 'WAITING'].includes(callStatus.get(s.id) ?? 'WAITING'));
  recalled.forEach(s => callStatus.set(s.id, 'RECALLED'));

  undoStack.push({ studentIds: students.map(s => s.id), prevStatuses, tag, callType: 'RECALL' });
  document.getElementById('btnUndoLast').disabled = false;

  const names = students.map(s => `${s.first_name} ${s.last_name}`);
  pushRecent(tag, names, 'FAMILY', true);
  playRecallSound();
  showToast(`Tag ${tag} recalled`);
  if (recalled.length) broadcastStudentCalls(recalled.map(s => ({ student_id: s.id, status: 'RECALLED', called_at: null, recalled_at: now, call_type: 'FAMILY' })));
}

async function callBusGroup(busGroupId) {
  if (!currentEvent || currentEvent.status === 'CLOSED') {
    showToast('Dismissal is not open'); return;
  }
  if (calledBusIds.has(busGroupId)) {
    await recallBusGroup(busGroupId);
    return;
  }

  const group    = allBusGroups.find(b => b.id === busGroupId);
  const students = allStudents.filter(s => s.bus_group_id === busGroupId);
  const now      = new Date().toISOString();

  const { error } = await supabase
    .from('carline_bus_arrivals')
    .insert({
      school_id:            profile.school_id,
      carline_event_id:     currentEvent.id,
      bus_group_id:         busGroupId,
      called_at:            now,
      called_by_profile_id: profile.id,
    });

  if (error) { showToast('Bus call failed'); return; }

  calledBusIds.add(busGroupId);

  broadcastToDisplay('bus_arrival', { bus_group_id: busGroupId });

  if (students.length) {
    await callStudents(students, group?.name ?? 'Bus', 'BUS');
  } else {
    showToast(`${group?.name ?? 'Bus'} called`);
    pushRecent(group?.name ?? busGroupId, [], 'BUS', false);
    updateBusButtonStates();
  }
}

// Tapping an already-called bus group undoes it -- catches an accidental
// tap without deleting the original arrival row (recalled_at marks it
// undone, keeping the call log intact for the day's record).
async function recallBusGroup(busGroupId) {
  const group = allBusGroups.find(b => b.id === busGroupId);
  const now   = new Date().toISOString();

  const { error } = await supabase
    .from('carline_bus_arrivals')
    .update({ recalled_at: now })
    .eq('carline_event_id', currentEvent.id)
    .eq('bus_group_id', busGroupId)
    .is('recalled_at', null);

  if (error) { showToast('Recall failed'); return; }

  calledBusIds.delete(busGroupId);
  updateBusButtonStates();
  showToast(`${group?.name ?? 'Bus'} call undone`);

  broadcastToDisplay('bus_recall', { bus_group_id: busGroupId });
}

// ─── Flag-based family groups ─────────────────────────────────────────

// Students of every flagged family, scoped to the campus running dismissal.
function flagGroupStudents(group) {
  const familyIds = flagFamilyIds.get(group.flag);
  if (!familyIds?.size) return [];
  return allStudents.filter(s => familyIds.has(s.family_id) && atActiveCampus(s));
}

// True while a group call is outstanding: at least one student is still
// CALLED under this group's call type. Reading it off the call rows (rather
// than local state) keeps every operator device in agreement.
function flagGroupIsCalled(group, students) {
  return students.some(s => callStatus.get(s.id) === 'CALLED' && callTypeById.get(s.id) === group.callType);
}

async function callFlagGroup(flag) {
  if (!currentEvent || currentEvent.status === 'CLOSED') {
    showToast('Dismissal is not open'); return;
  }
  const group = FLAG_GROUPS.find(g => g.flag === flag);
  if (!group) return;

  const students = flagGroupStudents(group);
  if (flagGroupIsCalled(group, students)) {
    await undoFlagGroup(group, students);
    return;
  }
  if (!students.length) { showToast(`No ${group.label} students at this campus`); return; }

  await callStudents(students, group.label, group.callType);
}

// Tapping a lit group button undoes an accidental tap: the students drop
// back to Waiting rather than Recalled, and only rows this group called are
// touched -- a family also called by tag keeps its own call.
async function undoFlagGroup(group, students) {
  const ids = students
    .filter(s => callStatus.get(s.id) === 'CALLED' && callTypeById.get(s.id) === group.callType)
    .map(s => s.id);
  if (!ids.length) return;

  const { error } = await supabase
    .from('carline_calls')
    .update({ status: 'WAITING', called_at: null })
    .eq('carline_event_id', currentEvent.id)
    .eq('call_type', group.callType)
    .eq('status', 'CALLED')
    .in('student_id', ids);

  if (error) { showToast('Undo failed'); return; }

  ids.forEach(id => callStatus.set(id, 'WAITING'));

  // Drop the matching entry from the undo stack / recent list so "Undo Last"
  // doesn't later rewind a call that has already been undone here.
  if (undoStack.at(-1)?.callType === group.callType) {
    undoStack.pop();
    recentCalls.shift();
    renderRecentList();
    document.getElementById('btnUndoLast').disabled = undoStack.length === 0;
  }

  updateGroupButtons();
  broadcastStudentCalls(ids.map(id => ({
    student_id: id, status: 'WAITING', called_at: null, call_type: group.callType,
  })));
  showToast(`${group.label} call undone`);
}

async function undoLast() {
  if (!undoStack.length) return;
  const op = undoStack.pop();

  const { error } = await supabase
    .from('carline_calls')
    .upsert(
      op.prevStatuses.map(({ id, prev }) => ({
        school_id: profile.school_id,
        carline_event_id: currentEvent.id,
        student_id: id,
        status: prev,
      })),
      { onConflict: 'carline_event_id,student_id' }
    );

  if (error) { showToast('Undo failed'); undoStack.push(op); return; }

  op.prevStatuses.forEach(({ id, prev }) => callStatus.set(id, prev));
  document.getElementById('btnUndoLast').disabled = undoStack.length === 0;
  recentCalls.shift();
  renderRecentList();
  updateGroupButtons();
  broadcastStudentCalls(op.prevStatuses.map(({ id, prev }) => ({
    student_id: id, status: prev, called_at: null, call_type: op.callType,
  })));
  showToast(`Undid call for tag ${op.tag}`);
}

async function undoByTag() {
  const tag = prompt('Enter tag number to undo:');
  if (!tag) return;
  const trimmed = tag.trim();

  const students = studentsForTag(trimmed);
  if (students === null) { showToast(`Tag ${tag} not found`); return; }
  if (!students.length) { showToast(`No students for tag ${tag} at this campus`); return; }

  // Same reasoning as recallStudents: target students, not family_id.
  const { error } = await supabase
    .from('carline_calls')
    .update({ status: 'WAITING' })
    .eq('carline_event_id', currentEvent.id)
    .in('student_id', students.map(s => s.id));

  if (error) { showToast('Undo failed'); return; }
  students.forEach(s => callStatus.set(s.id, 'WAITING'));
  updateGroupButtons();
  broadcastStudentCalls(students.map(s => ({
    student_id: s.id, status: 'WAITING', called_at: null, call_type: 'FAMILY',
  })));
  showToast(`↩ Tag ${tag} reset to Waiting`);
}

// ─── All Call ──────────────────────────────────────────────────────────
async function allCall() {
  if (!currentEvent || currentEvent.status === 'CLOSED') return;

  const waiting = allStudents.filter(s =>
    (callStatus.get(s.id) ?? 'WAITING') === 'WAITING' && atActiveCampus(s)
  );
  if (!waiting.length) { showToast('No waiting students remaining at this campus'); return; }

  if (!confirm(`Send All Call?\n\nAll ${waiting.length} remaining student${waiting.length !== 1 ? 's' : ''} will appear as called on the display. Individual tags still work for actual pickups — students not called by tag won't have a record.`)) return;

  const now = new Date().toISOString();
  const { error } = await supabase
    .from('carline_events')
    .update({ all_call_at: now })
    .eq('id', currentEvent.id);

  if (error) { showToast('All Call failed'); return; }

  undoStack.length = 0;
  document.getElementById('btnUndoLast').disabled = true;
  playAllCallSound();
  showToast('All Call sent');

  broadcastToDisplay('all_call', {});
}

async function resetDay() {
  if (!currentEvent) return;
  if (!confirm('Reset today\'s dismissal? This will clear ALL call records and the All Call banner.')) return;

  const [{ error: delErr }, { error: evErr }] = await Promise.all([
    supabase.from('carline_calls').delete().eq('carline_event_id', currentEvent.id),
    supabase.from('carline_events').update({ all_call_at: null }).eq('id', currentEvent.id),
  ]);

  if (delErr) { showToast('Reset failed'); return; }
  if (evErr) console.warn('Failed to clear all_call_at:', evErr.message);

  callStatus.clear();
  callTypeById.clear();
  undoStack.length = 0;
  recentCalls.length = 0;
  document.getElementById('btnUndoLast').disabled = true;
  renderRecentList();
  updateGroupButtons();
  // Its own event rather than a student_call listing every student: a reset
  // deletes the rows outright, and on a 1000+ roster that payload would be
  // enormous for what is really just "clear everything".
  broadcastToDisplay('reset_day', {});
  showToast('Day reset — all calls cleared');
}

// ─── Keypad ───────────────────────────────────────────────────────────
function buildKeypad() {
  const pad = document.getElementById('keypad');
  ['7','8','9','4','5','6','1','2','3','⌫','0','✓'].forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'inp-key' + (k === '⌫' ? ' backspace' : '') + (k === '✓' ? ' confirm' : '');
    btn.textContent = k;
    btn.addEventListener('click', () => keyPress(k));
    pad.appendChild(btn);
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key >= '0' && e.key <= '9') keyPress(e.key);
    else if (e.key === 'Backspace') keyPress('⌫');
    else if (e.key === 'Enter') keyPress('✓');
  });
}

function keyPress(k) {
  if (k === '⌫') {
    tagBuffer = tagBuffer.slice(0, -1);
  } else if (k === '✓') {
    if (tagBuffer) callByTag(tagBuffer, false);
  } else {
    if (tagBuffer.length >= 6) return;
    tagBuffer += k;
  }
  renderTagDisplay();
}

function clearTag() {
  tagBuffer = '';
  renderTagDisplay();
}

function renderTagDisplay() {
  document.getElementById('tagDisplayText').textContent = tagBuffer || '—';
  document.getElementById('tagDisplay').classList.toggle('has-value', tagBuffer.length > 0);
}

// ─── Bus grid ─────────────────────────────────────────────────────────
function renderBusGrid() {
  const grid = document.getElementById('busGrid');
  grid.innerHTML = '';
  if (!allBusGroups.length) {
    grid.innerHTML = '<div style="color:var(--cl-text-muted);font-size:13px;">No bus groups configured</div>';
    return;
  }
  allBusGroups.forEach(g => {
    const total    = allStudents.filter(s => s.bus_group_id === g.id).length;
    const called   = allStudents.filter(s => s.bus_group_id === g.id && callStatus.get(s.id) === 'CALLED').length;
    const isCalled = calledBusIds.has(g.id);
    const btn = document.createElement('button');
    btn.className = 'inp-bus-btn' + (isCalled ? ' called' : '');
    btn.dataset.busId = g.id;
    btn.innerHTML = `
      <div class="inp-bus-btn-icon">${SVG_BUS}</div>
      <div class="inp-bus-btn-name">${esc(g.name)}</div>
      ${g.route_number ? `<div class="inp-bus-btn-meta">Route ${esc(g.route_number)}</div>` : ''}
      <div class="inp-bus-btn-meta">${total > 0 ? `${called}/${total} called` : 'No assigned students'}</div>
    `;
    btn.addEventListener('click', () => callBusGroup(g.id));
    grid.appendChild(btn);
  });
}

// ─── Flag group grid ──────────────────────────────────────────────────
function renderFlagGroupGrid() {
  const section = document.getElementById('flagGroupSection');
  const grid    = document.getElementById('flagGroupGrid');
  const active  = FLAG_GROUPS.filter(g => flagFamilyIds.get(g.flag)?.size);
  section.hidden = active.length === 0;
  grid.innerHTML = '';
  active.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'inp-bus-btn inp-flag-btn';
    btn.dataset.flag = g.flag;
    btn.innerHTML = `
      <div class="inp-bus-btn-icon">${g.icon}</div>
      <div class="inp-bus-btn-name">${esc(g.label)}</div>
      <div class="inp-bus-btn-meta" data-role="families"></div>
      <div class="inp-bus-btn-meta" data-role="count"></div>
    `;
    btn.addEventListener('click', () => callFlagGroup(g.flag));
    grid.appendChild(btn);
  });
  updateFlagGroupStates();
}

function updateFlagGroupStates() {
  FLAG_GROUPS.forEach(g => {
    const btn = document.querySelector(`.inp-flag-btn[data-flag="${g.flag}"]`);
    if (!btn) return;
    const students = flagGroupStudents(g);
    const called   = students.filter(s => callStatus.get(s.id) === 'CALLED').length;
    const families = new Set(students.map(s => s.family_id)).size;
    btn.classList.toggle('called', flagGroupIsCalled(g, students));
    btn.querySelector('[data-role="families"]').textContent =
      `${families} famil${families === 1 ? 'y' : 'ies'}`;
    btn.querySelector('[data-role="count"]').textContent = students.length
      ? `${called}/${students.length} called`
      : 'No students at this campus';
  });
}

// Every call action refreshes both group grids -- bus buttons and flag
// buttons both read their state out of the same call records.
function updateGroupButtons() {
  updateBusButtonStates();
  updateFlagGroupStates();
}

function updateBusButtonStates() {
  allBusGroups.forEach(g => {
    const total    = allStudents.filter(s => s.bus_group_id === g.id).length;
    const called   = allStudents.filter(s => s.bus_group_id === g.id && callStatus.get(s.id) === 'CALLED').length;
    const isCalled = calledBusIds.has(g.id);
    const btn = document.querySelector(`.inp-bus-btn[data-bus-id="${g.id}"]`);
    if (!btn) return;
    btn.classList.toggle('called', isCalled);
    const meta = btn.querySelectorAll('.inp-bus-btn-meta');
    const countEl = [...meta].find(el => el.textContent.includes('/') || el.textContent.includes('No assigned'));
    if (countEl) countEl.textContent = total > 0 ? `${called}/${total} called` : 'No assigned students';
  });
}

// ─── Recent activity ──────────────────────────────────────────────────
function pushRecent(tag, names, type, isRecall) {
  const now  = Date.now();
  const existing = recentCalls.find(r => r.tag === tag && now - r.ts < 2000 && r.isRecall === isRecall);
  if (existing) {
    names.forEach(n => { if (!existing.names.includes(n)) existing.names.push(n); });
  } else {
    recentCalls.unshift({ tag, names: [...names], type, isRecall, time: new Date(), ts: now });
    if (recentCalls.length > 30) recentCalls.pop();
  }
  renderRecentList();
}

function renderRecentList() {
  const ul = document.getElementById('recentList');
  ul.innerHTML = '';
  if (!recentCalls.length) {
    ul.innerHTML = '<li style="color:var(--cl-text-muted);font-size:13px;padding:8px 0;">No calls yet today</li>';
    return;
  }
  recentCalls.forEach(r => {
    const li = document.createElement('li');
    li.className = 'inp-recent-item' + (r.isRecall ? ' recalled' : '');
    const label = r.type === 'BUS' ? 'Bus'
      : FLAG_GROUPS.some(g => g.callType === r.type) ? 'Group'
      : r.isRecall ? 'Recall' : 'Call';
    const namesDisplay = r.names.length
      ? r.names.map(esc).join(', ')
      : (r.type === 'BUS' ? '<em style="opacity:0.6;">no assigned students</em>' : '');
    li.innerHTML = `
      <span class="inp-recent-tag">${esc(String(r.tag))}</span>
      <span class="inp-recent-names">${namesDisplay}</span>
      <span class="inp-recent-type">${label}</span>
      <span class="inp-recent-time">${r.time.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span>
    `;
    ul.appendChild(li);
  });
}

// ─── UI helpers ───────────────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('clToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toggleDarkMode() {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  document.getElementById('btnDarkMode').innerHTML = dark ? SVG_MOON : SVG_SUN;
}

// ─── Wire events ──────────────────────────────────────────────────────
function wireEvents() {
  document.getElementById('btnSignOut').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = '/login.html';
  });
  document.getElementById('btnDarkMode').addEventListener('click', toggleDarkMode);
  document.getElementById('btnStartNoEvent').addEventListener('click', handleStartClick);
  document.getElementById('btnReopenDismissal').addEventListener('click', reopenDismissal);
  document.getElementById('btnCloseDismissal').addEventListener('click', closeDismissal);
  document.getElementById('campusPickerCancel').addEventListener('click', () => {
    document.getElementById('campusPicker').hidden = true;
  });

  document.getElementById('btnCall').addEventListener('click', () => {
    if (tagBuffer) callByTag(tagBuffer, false);
  });
  document.getElementById('btnRecall').addEventListener('click', () => {
    if (tagBuffer) callByTag(tagBuffer, true);
  });
  document.getElementById('btnClearTag').addEventListener('click', clearTag);
  document.getElementById('btnUndoLast').addEventListener('click', undoLast);
  document.getElementById('btnUndoTag').addEventListener('click', undoByTag);
  document.getElementById('btnAllCall').addEventListener('click', allCall);
  document.getElementById('btnResetDay').addEventListener('click', resetDay);

  wireAudioPriming();
}

boot().catch(err => {
  console.error('Carline input failed to load:', err);
  const msg = err?.message ?? String(err);
  const isHttps = msg.toLowerCase().includes('insecure') || msg.toLowerCase().includes('websocket');
  document.getElementById('clLoading').innerHTML =
    `<div style="padding:24px;color:#dc2626;text-align:center;max-width:340px;">
      <strong>Failed to load</strong><br><br>
      ${isHttps
        ? `<p style="font-size:14px;">This page requires <strong>HTTPS</strong>. Safari blocks WebSocket connections over plain HTTP.<br><br>Use a secure URL (e.g. your deployed Vercel site, or an ngrok tunnel) when accessing from a mobile device.</p>`
        : `<code style="font-size:12px;word-break:break-all;">${msg}</code><br><br><small>Check the browser console for details.</small>`
      }
    </div>`;
});
</script>
