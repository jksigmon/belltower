<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Assignments</title>
  <link rel="stylesheet" href="/admin-ui.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="manifest" href="/icons/site.webmanifest">
  <link rel="icon" href="/icons/favicon.ico">
  <style>
    /* ── Toolbar ── */
    .veh-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .veh-trip-name-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .veh-trip-name {
      font-size: 15px;
      font-weight: 800;
      color: #0b2d4f;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .veh-trip-date {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      background: #eef2f7;
      border: 1px solid #dbe3ec;
      border-radius: 999px;
      padding: 3px 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .veh-save-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #6b7280;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .veh-save-status.saving { background: #fef3c7; color: #92400e; }
    .veh-save-status.saved  { background: #dcfce7; color: #15803d; }
    .veh-save-status.error  { background: #fee2e2; color: #dc2626; }

    /* ── Search ── */
    .veh-search-wrap { position: relative; flex-shrink: 0; }
    .veh-search {
      height: 30px;
      font-size: 13px;
      padding: 0 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      width: 170px;
      flex-shrink: 0;
    }
    .veh-search-wrap .veh-search { padding-right: 32px; width: 170px; }
    .veh-kbd {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      font: 700 10px/1 inherit;
      color: #9ca3af;
      background: #f1f5f9;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 2px 5px;
      pointer-events: none;
    }

    /* ── Main scroll region ──
       body.admin-page pins the page itself (height:100vh; overflow:hidden)
       and expects one child to scroll internally. The vehicle grid can wrap
       into more rows than fit on screen, so .veh-main — not the page — has
       to be the thing that scrolls. */
    .veh-main {
      overflow-y: auto;
      min-height: 0;
    }

    /* ── Board ──
       Unassigned is pinned as a tall sidebar (it's the one column that can
       genuinely run long); driver/vehicle columns wrap into a grid since each
       vehicle only holds a handful of students — a single row of 20+ skinny
       columns wastes most of their height and forces horizontal scrolling. */
    .veh-board {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      padding: 18px 20px 40px;
      align-items: flex-start;
    }

    /* ── Unassigned sidebar ── */
    .veh-unassigned-wrap {
      flex: 0 0 260px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 90px);
      position: sticky;
      top: 18px;
    }
    .veh-unassigned-header { padding: 14px 14px 10px; flex-shrink: 0; }
    .veh-unassigned-title { font-size: 14px; font-weight: 800; color: #0b2d4f; }
    .veh-unassigned-count { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .veh-unassigned-search-wrap { padding: 0 14px 10px; flex-shrink: 0; }
    .veh-unassigned-search-wrap .veh-search { width: 100%; }
    .veh-unassigned-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px;
      min-height: 60px;
    }
    .veh-unassigned-list.drag-over { background: rgba(59,130,246,0.06); }
    .veh-unassigned-footer {
      flex-shrink: 0;
      padding: 8px 14px;
      border-top: 1px solid #eef1f5;
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
    }

    /* ── Vehicle grid ── */
    .veh-vehicle-section { flex: 1; min-width: 260px; display: flex; flex-direction: column; }
    .veh-vehicle-section-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .veh-vehicle-section-title { font-size: 16px; font-weight: 800; color: #0b2d4f; }
    .veh-vehicle-section-stats { font-size: 13px; color: #6b7280; }
    .veh-vehicle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 220px));
      gap: 12px;
      align-items: start;
      align-content: start;
    }
    .veh-col {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
      display: flex;
      flex-direction: column;
      width: 100%;
      max-height: 340px;
    }

    .veh-col-header {
      padding: 12px 14px 10px;
      border-bottom: 1px solid #f1f5f9;
      flex-shrink: 0;
    }
    .veh-col-title {
      font-size: 13px;
      font-weight: 800;
      color: #0b2d4f;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .veh-col-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #6b7280;
      flex-wrap: wrap;
    }
    .veh-cap-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #eff6ff;
      color: #1d4ed8;
      cursor: pointer;
      border: 1px solid #bfdbfe;
      white-space: nowrap;
      transition: background 0.12s;
    }
    .veh-cap-badge:hover { background: #dbeafe; }
    .veh-cap-badge.at-cap   { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .veh-cap-badge.over-cap { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

    .veh-progress {
      height: 4px;
      background: #f1f5f9;
      margin: 0 14px 10px;
      border-radius: 999px;
      overflow: hidden;
    }
    .veh-progress-fill { height: 100%; border-radius: 999px; transition: width 0.15s, background 0.15s; }

    .veh-col-body {
      flex: 1;
      padding: 0 10px 10px;
      overflow-y: auto;
      min-height: 60px;
      display: flex;
      flex-direction: column;
    }
    .veh-col-body.drag-over { background: rgba(59,130,246,0.07); border-radius: 0 0 13px 13px; }
    .veh-cards { flex: 1; }

    /* ── Empty-state / add affordance ── */
    .veh-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      border: 1.5px dashed #d1d5db;
      border-radius: 10px;
      padding: 16px 10px;
      cursor: pointer;
    }
    .veh-empty-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid #93c5fd;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      background: #fff;
    }
    .veh-empty-title { font-size: 12px; font-weight: 700; color: #2563eb; }
    .veh-empty-hint { font-size: 11px; color: #9ca3af; line-height: 1.4; }
    .veh-add-link {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
      padding: 6px 4px 2px;
      cursor: pointer;
    }
    .veh-add-link:hover { text-decoration: underline; }

    /* ── Student rows (shared by vehicle cards + unassigned sidebar) ── */
    .veh-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 6px 8px;
      margin-bottom: 6px;
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.12s, opacity 0.12s;
    }
    .veh-card:active { cursor: grabbing; }
    .veh-card:hover  { box-shadow: 0 2px 8px rgba(0,0,0,0.10); }
    .veh-card.dragging { opacity: 0.45; }
    .veh-card.selected {
      outline: 2px solid #2563eb;
      outline-offset: -1px;
      background: #eff6ff;
    }
    .veh-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .veh-card-name {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .veh-card-grade {
      font-size: 10px;
      font-weight: 700;
      color: #6b7280;
      background: #f1f5f9;
      border-radius: 999px;
      padding: 1px 7px;
      flex-shrink: 0;
    }

    /* ── Selection / click-to-move ── */
    .veh-col.click-target,
    .veh-unassigned-wrap.click-target {
      box-shadow: 0 0 0 2px rgba(37,99,235,0.28);
    }
    .veh-col.click-target .veh-col-body,
    .veh-unassigned-wrap.click-target .veh-unassigned-list {
      cursor: pointer;
    }
    .veh-selection-badge {
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
      white-space: nowrap;
      cursor: pointer;
    }

    /* ── Touch/mobile advisory ── */
    .veh-mobile-notice {
      display: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: #92400e;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
      margin: 12px 20px 0;
    }
    .veh-mobile-notice button {
      flex-shrink: 0;
      background: none;
      border: none;
      color: inherit;
      font-size: 15px;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
    }
    @media (max-width: 767px) {
      .veh-mobile-notice { display: flex; }
    }

    /* ── Print ── */
    @media print {
      html, body {
        height: auto !important;
        overflow: visible !important;
        background: #fff !important;
      }
      .veh-toolbar, .veh-main { display: none !important; }
      .print-roster { display: block !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    .print-roster { display: none; padding: 24px; }
    .print-roster h1 {
      font-size: 22px; font-weight: 800; color: #0b2d4f; margin: 0 0 4px 0;
    }
    .print-meta { font-size: 13px; color: #6b7280; margin-bottom: 22px; }
    .print-vehicles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .print-vehicle-box {
      border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 14px 16px; break-inside: avoid;
    }
    .print-vehicle-name { font-size: 14px; font-weight: 800; color: #0b2d4f; margin-bottom: 2px; }
    .print-vehicle-cap  { font-size: 11px; color: #6b7280; margin-bottom: 10px; }
    .print-vehicle-student {
      font-size: 13px; color: #374151; padding: 3px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .print-vehicle-student:last-child { border-bottom: none; }
    .print-unassigned { margin-top: 20px; border-top: 2px solid #e5e7eb; padding-top: 16px; }
    .print-unassigned-title { font-size: 13px; font-weight: 700; color: #dc2626; margin-bottom: 8px; }
  </style>
</head>

<body class="admin-page" style="background:#f8fafc;">

<!-- ── Toolbar ── -->
<div class="veh-toolbar">
  <a href="/app/field-trips.html" class="btn btn-sm" style="flex-shrink:0;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Field Trips
  </a>
  <div class="veh-trip-name-wrap">
    <div class="veh-trip-name" id="vehTripName">Loading…</div>
    <span class="veh-trip-date" id="vehTripDate" hidden></span>
  </div>
  <div class="veh-search-wrap">
    <input type="search" id="vehSearch" class="veh-search" placeholder="Search students…">
    <kbd class="veh-kbd">⌘K</kbd>
  </div>
  <span class="veh-selection-badge" id="vehSelectionBadge" title="Click to cancel selection" hidden></span>
  <span class="veh-save-status" id="vehSaveStatus"></span>
  <button class="btn btn-sm" id="vehUndoBtn" style="flex-shrink:0;" title="Undo last move (Ctrl+Z)" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    Undo
  </button>
  <button class="btn btn-primary btn-sm" id="vehAutoAssignBtn" style="flex-shrink:0;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 6.4L20 10l-6.4 1.6L12 18l-1.6-6.4L4 10l6.4-1.6L12 2z"/></svg>
    Auto-assign
  </button>
  <button class="btn btn-sm" id="vehClearBtn" style="flex-shrink:0;">Clear All</button>
  <button class="btn btn-sm" id="vehPrintBtn" style="flex-shrink:0;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    Print Roster
  </button>
  <!-- Hidden elements for auth layer -->
  <span id="userInitials" style="display:none;"></span>
  <span id="userDropdownName" style="display:none;"></span>
</div>

<!-- Scrollable region: body.admin-page pins the page itself, so this div
     (not the page) is what scrolls when the vehicle grid runs tall. -->
<div class="veh-main">
  <!-- Touch/mobile advisory: drag-and-drop needs a mouse/trackpad, but tap-to-select works everywhere -->
  <div class="veh-mobile-notice" id="vehMobileNotice">
    <span>On a touch device, dragging cards may not work. Tap a student to select them (tap more to add to the selection), then tap a vehicle to move them there.</span>
    <button type="button" aria-label="Dismiss" onclick="document.getElementById('vehMobileNotice').remove()">&#10005;</button>
  </div>

  <!-- ── Board ── -->
  <div class="veh-board" id="vehBoard">
    <div style="padding:60px 40px;color:#9ca3af;font-size:14px;">Loading…</div>
  </div>
</div>

<!-- ── Print roster (hidden on screen) ── -->
<div class="print-roster" id="printRoster"></div>

<script type="module" src="/app/field-trip-vehicles.js?v=2"></script>
</body>
</html>
